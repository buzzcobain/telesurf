<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Telesurf Dashboard</title>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      border-bottom: 4px solid #00FF00;
      padding-bottom: 10px;
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: bold;
    }
    .header span.page { color: #FFFF00; }
    .header span.title { color: #00FFFF; }
    .header span.clock { color: #FFFFFF; }
    
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      align-items: start;
    }
    
    .widget {
      border: 2px solid #FF00FF;
      padding: 15px;
      background: #000;
      min-height: 150px;
    }
    
    .widget h2 {
      margin-top: 0;
      border-bottom: 2px solid #00FFFF;
      padding-bottom: 5px;
      text-transform: uppercase;
      font-size: 20px;
      color: #FFFF00;
    }
    
    /* Teletext Snake specific */
    #snake-game {
      border: 2px solid #00FF00;
      outline: none;
      width: 100%;
      height: auto;
      max-width: 400px;
      display: block;
      margin: 0 auto;
    }
    
    .error { color: #FF0000; font-weight: bold; }
    .loading { color: #00FF00; animation: blink 1s infinite; }
    
    @keyframes blink {
      50% { opacity: 0; }
    }
    
    table { width: 100%; border-collapse: collapse; }
    td { padding: 5px 0; border-bottom: 1px dashed #444; }
    .score { color: #FFFF00; font-weight: bold; text-align: right; }
  </style>
</head>
<body>
  
  <div class="header">
    <div>
      <span class="page">P100</span>
      <span class="title">TELESURF INDEX</span>
    </div>
    <div>
      <span id="loc-display" style="color: #00FFFF; margin-right: 15px; font-size: 20px;">
        <span id="loc-text">LONDON</span>
        <span id="edit-loc" style="cursor: pointer; color: #FFFF00; margin-left: 5px;" title="Edit Location">✎</span>
      </span>
      <span class="clock" id="clock">00:00:00</span>
    </div>
  </div>

  <div class="grid-container" id="grid">
    <!-- Widgets will be injected here -->
  </div>
  
  <script>
    // Clock
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
    }, 1000);

    const grid = document.getElementById('grid');
    const locText = document.getElementById('loc-text');
    const editLocBtn = document.getElementById('edit-loc');

    editLocBtn.addEventListener('click', () => {
      if (window.electronAPI && window.electronAPI.showSettingsMenu) {
        window.electronAPI.showSettingsMenu();
      }
    });

    async function initDashboard() {
      console.log("initDashboard called!");
      console.log("electronAPI keys:", window.electronAPI ? Object.keys(window.electronAPI) : 'undefined');
      // 1. Get Config
      let config = { weather: true, sports: true, games: true, team: 'Arsenal', location: '' };
      if (window.electronAPI && window.electronAPI.getDashboardConfig) {
        console.log("Requesting config from main process...");
        config = await window.electronAPI.getDashboardConfig();
        console.log("Got config:", config);
      }
      
      // Update header location
      if (config.location) {
        locText.innerText = config.location.toUpperCase();
      } else {
        const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/London';
        const parts = timeZone.split('/');
        locText.innerText = parts[parts.length - 1].replace(/_/g, ' ').toUpperCase();
      }

      grid.innerHTML = ''; // Clear

      // 2. Weather Widget
      if (config.weather) {
        console.log("Weather enabled, setting up widget...");
        const weatherDiv = document.createElement('div');
        weatherDiv.className = 'widget';
        weatherDiv.innerHTML = `<h2>LOCAL WEATHER</h2><div id="weather-content" class="loading">FETCHING DATA...</div>`;
        grid.appendChild(weatherDiv);
        
        if (window.electronAPI && window.electronAPI.getWeatherData) {
          console.log("Calling getWeatherData...");
          window.electronAPI.getWeatherData().then(data => {
            console.log("Got weather data:", data);
            const content = document.getElementById('weather-content');
            content.classList.remove('loading');
            if (data.success) {
              const codeMap = {
                0: 'CLEAR SKY', 1: 'MAINLY CLEAR', 2: 'PARTLY CLOUDY', 3: 'OVERCAST',
                45: 'FOG', 48: 'DEPOSITING RIME FOG', 51: 'LIGHT DRIZZLE', 53: 'MODERATE DRIZZLE',
                61: 'SLIGHT RAIN', 63: 'MODERATE RAIN', 65: 'HEAVY RAIN', 71: 'SLIGHT SNOW',
                80: 'RAIN SHOWERS', 95: 'THUNDERSTORM'
              };
              const desc = codeMap[data.code] || 'UNKNOWN';
              
              let asciiArt = "";
              if ([0, 1].includes(data.code)) {
                asciiArt = "  \\   /  \n   .-.   \n- (   ) -\n   `-`   \n  /   \\  ";
              } else if ([2, 3, 45, 48].includes(data.code)) {
                asciiArt = "   .--.  \n .(    ).\n(___.__)_)";
              } else if ([51, 53, 61, 63, 65, 80].includes(data.code)) {
                asciiArt = "   .--.  \n .(    ).\n(___.__)_)\n ' ' ' ' \n  ' ' ' '";
              } else if ([71].includes(data.code)) {
                asciiArt = "   .--.  \n .(    ).\n(___.__)_)\n *  *  * \n  *  *  *";
              } else if ([95].includes(data.code)) {
                asciiArt = "   .--.  \n .(    ).\n(___.__)_)\n   /     \n  /      ";
              } else {
                asciiArt = "   ???   ";
              }

              content.innerHTML = `
                <div style="font-size: 22px; color: #00FFFF; margin-bottom: 10px;">${data.city.toUpperCase()}</div>
                <div style="display: flex; align-items: center;">
                  <pre style="color: #FFFF00; font-weight: bold; margin: 0 20px 0 0; font-size: 14px;">${asciiArt}</pre>
                  <div>
                    <div style="font-size: 32px; color: #FFFF00; margin-bottom: 10px;">${data.temp}°C</div>
                    <div style="color: #00FF00; margin-bottom: 5px;">COND: ${desc}</div>
                    <div style="color: #FF00FF;">WIND: ${data.wind} km/h</div>
                  </div>
                </div>
              `;
            } else {
              content.innerHTML = `<span class="error">${data.error}</span>`;
            }
          });
        }
      }

      // 3. Sports Widget
      if (config.sports) {
        const sportsDiv = document.createElement('div');
        sportsDiv.className = 'widget';
        sportsDiv.innerHTML = `<h2>SPORTS: ${config.team.toUpperCase()}</h2><div id="sports-content" class="loading">FETCHING DATA...</div>`;
        grid.appendChild(sportsDiv);
        
        if (window.electronAPI && window.electronAPI.getSportsData) {
          window.electronAPI.getSportsData(config.team).then(data => {
            const content = document.getElementById('sports-content');
            content.classList.remove('loading');
            if (data.success) {
              let html = `<div style="display: flex; align-items: center; margin-bottom: 15px;">`;
              if (data.badge) {
                html += `<img src="${data.badge}" style="width: 50px; height: 50px; margin-right: 15px;" alt="Logo" />`;
              }
              html += `<div style="color: #00FFFF; font-size: 20px;">${data.team.toUpperCase()}</div></div>`;
              
              html += `<div style="color: #FFFFFF; font-weight: bold; margin-bottom: 5px;">LAST MATCH:</div>`;
              if (data.lastEvent) {
                const e = data.lastEvent;
                const venue = e.isHome ? '(H)' : '(A)';
                let resColor = '#FFFF00'; // Draw
                let resArt = " -----\n\n -----"; // Draw art
                const ourScore = e.isHome ? e.homeScore : e.awayScore;
                const theirScore = e.isHome ? e.awayScore : e.homeScore;
                if (parseInt(ourScore) > parseInt(theirScore)) {
                  resColor = '#00FF00'; // Win
                  resArt = " \\_._/ \n  | |  \n  ===  ";
                } else if (parseInt(ourScore) < parseInt(theirScore)) {
                  resColor = '#FF0000'; // Loss
                  resArt = " \\   / \n  \\ /  \n  / \\  \n /   \\ ";
                }
                
                html += `<div style="display: flex; align-items: center; margin-bottom: 15px;">`;
                html += `<pre style="color: ${resColor}; font-weight: bold; margin: 0 15px 0 0; font-size: 12px; width: 60px;">${resArt}</pre>`;
                html += `<div>`;
                html += `<div style="color: #CCCCCC;">${e.date}</div>`;
                html += `<div>vs <span style="color: #00FFFF;">${e.opponent}</span> ${venue}</div>`;
                html += `<div>SCORE: <span style="color: ${resColor}; font-weight:bold;">${e.homeScore} - ${e.awayScore}</span></div>`;
                html += `</div></div>`;
              } else {
                html += `<div style="color: #888888; margin-bottom: 15px;">NO DATA</div>`;
              }

              html += `<div style="color: #FFFFFF; font-weight: bold; margin-bottom: 5px;">NEXT MATCH:</div>`;
              if (data.nextEvent) {
                const e = data.nextEvent;
                const venue = e.isHome ? '(H)' : '(A)';
                html += `<div style="color: #CCCCCC;">${e.date}</div>`;
                html += `<div>vs <span style="color: #00FFFF;">${e.opponent}</span> ${venue}</div>`;
              } else {
                html += `<div style="color: #888888;">NO DATA</div>`;
              }

              content.innerHTML = html;
            } else {
              content.innerHTML = `<span class="error">${data.error}</span>`;
            }
          });
        }
      }

      // 4. Games Widget (Bamboozle)
      if (config.games) {
        const gamesDiv = document.createElement('div');
        gamesDiv.className = 'widget';
        gamesDiv.innerHTML = `
          <h2>BAMBOOZLE!</h2>
          <p style="color: #00FF00; font-size: 14px; text-align: center;">Bamber Boozler's Teletext Quiz</p>
          <div id="bamboozle-game" style="text-align: left; padding: 10px; min-height: 250px;">
            <div id="b-question" style="color: #00FFFF; font-size: 18px; margin-bottom: 20px; font-weight: bold; line-height: 1.4;"></div>
            <div id="b-options" style="display: flex; flex-direction: column; gap: 12px; font-size: 16px;"></div>
            <div id="b-status" style="margin-top: 20px; font-weight: bold; text-align: center; font-size: 18px;"></div>
          </div>
        `;
        grid.appendChild(gamesDiv);
        initBamboozle();
      }
    }

    // Bamboozle Logic
    function initBamboozle() {
      const qEl = document.getElementById('b-question');
      const optsEl = document.getElementById('b-options');
      const statusEl = document.getElementById('b-status');
      if (!qEl) return;

      const questions = [
        { q: "What is the capital of France?", opts: ["Berlin", "Madrid", "Paris", "Rome"], a: 2 },
        { q: "Which planet is known as the Red Planet?", opts: ["Venus", "Mars", "Jupiter", "Saturn"], a: 1 },
        { q: "What year did the Titanic sink?", opts: ["1912", "1905", "1923", "1898"], a: 0 },
        { q: "Who painted the Mona Lisa?", opts: ["Van Gogh", "Da Vinci", "Picasso", "Rembrandt"], a: 1 },
        { q: "What is the largest ocean on Earth?", opts: ["Atlantic", "Indian", "Arctic", "Pacific"], a: 3 },
        { q: "Which element has the chemical symbol 'O'?", opts: ["Gold", "Oxygen", "Osmium", "Oganesson"], a: 1 },
        { q: "How many continents are there?", opts: ["5", "6", "7", "8"], a: 2 },
        { q: "Who wrote 'Romeo and Juliet'?", opts: ["Charles Dickens", "William Shakespeare", "Mark Twain", "Jane Austen"], a: 1 }
      ];

      const colors = ['#FF0000', '#00FF00', '#FFFF00', '#00FFFF']; // Red, Green, Yellow, Cyan
      let currentQ = 0;
      let score = 0;

      // Shuffle questions
      for (let i = questions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [questions[i], questions[j]] = [questions[j], questions[i]];
      }

      function loadQuestion() {
        if (currentQ >= questions.length) {
          qEl.innerHTML = `Quiz Complete!`;
          optsEl.innerHTML = '';
          statusEl.style.color = '#FFFF00';
          statusEl.innerHTML = `You scored ${score} / ${questions.length}!<br><br><button onclick="window.location.reload()" style="background:#000; color:#00FFFF; border:2px solid #00FFFF; padding:5px 10px; cursor:pointer;">PLAY AGAIN</button>`;
          return;
        }

        const data = questions[currentQ];
        qEl.innerText = `Q${currentQ + 1}: ${data.q}`;
        optsEl.innerHTML = '';
        statusEl.innerText = '';

        data.opts.forEach((opt, idx) => {
          const btn = document.createElement('div');
          btn.style.cursor = 'pointer';
          btn.style.display = 'flex';
          btn.style.alignItems = 'center';
          btn.innerHTML = `<span style="display:inline-block; width:20px; height:20px; background-color:${colors[idx]}; margin-right:15px; border:2px solid #FFF;"></span> ${opt}`;
          
          btn.onclick = () => {
            if (idx === data.a) {
              score++;
              statusEl.style.color = '#00FF00';
              statusEl.innerText = "CORRECT!";
            } else {
              statusEl.style.color = '#FF0000';
              statusEl.innerText = "WRONG! It was " + data.opts[data.a];
            }
            // Disable clicks
            optsEl.style.pointerEvents = 'none';
            setTimeout(() => {
              optsEl.style.pointerEvents = 'auto';
              currentQ++;
              loadQuestion();
            }, 1500);
          };
          
          btn.onmouseover = () => btn.style.textDecoration = 'underline';
          btn.onmouseout = () => btn.style.textDecoration = 'none';
          
          optsEl.appendChild(btn);
        });
      }

      loadQuestion();
    }

    initDashboard();

    // Listen for config changes broadcasted from settings
    if (window.electronAPI && window.electronAPI.onDashboardChanged) {
      window.electronAPI.onDashboardChanged((newConfig) => {
        initDashboard();
      });
    }

    // Global error handler for debugging
    window.addEventListener('error', function(e) {
      const err = document.createElement('div');
      err.style.color = 'red';
      err.innerText = 'JS Error: ' + e.message + ' at line ' + e.lineno;
      document.body.appendChild(err);
    });
    window.addEventListener('unhandledrejection', function(e) {
      const err = document.createElement('div');
      err.style.color = 'red';
      err.innerText = 'Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
      document.body.appendChild(err);
    });
  </script>
</body>
</html>
