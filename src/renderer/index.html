<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Telesurf Shell</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Courier New', Courier, monospace;
      height: 110px;
      overflow: hidden;
      border-bottom: 4px solid #00FFFF;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    #browser-ui {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 5px 10px;
    }
    #tab-bar {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
      overflow-x: auto;
      border-bottom: 2px solid #FFFFFF;
      padding-bottom: 2px;
    }
    .tab {
      background-color: #000000;
      color: #00FFFF;
      border: 2px solid #00FFFF;
      padding: 2px 10px;
      margin-right: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      font-size: 16px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .tab.active {
      background-color: #FFFF00;
      color: #000000;
      border-color: #FFFF00;
    }
    .tab-close {
      margin-left: 10px;
      cursor: pointer;
      font-weight: bold;
      color: inherit;
    }
    .tab-close:hover {
      color: #FF0000;
    }
    #new-tab-btn {
      background: transparent;
      border: none;
      color: #00FF00;
      cursor: pointer;
      font-weight: bold;
      font-size: 20px;
    }
    #new-tab-btn:hover { background-color: #00FF00; color: #000000; }
    
    #top-bar {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
      margin-top: 5px;
    }
    button {
      background-color: #000000;
      color: #FF00FF;
      border: 2px solid #FF00FF;
      font-family: 'Courier New', Courier, monospace;
      padding: 2px 10px;
      cursor: pointer;
      margin-right: 5px;
      text-transform: uppercase;
      font-weight: bold;
      font-size: 16px;
    }
    button:hover {
      background-color: #FF00FF;
      color: #000000;
    }
    #url-form {
      flex-grow: 1;
      display: flex;
      align-items: center;
      margin: 0 10px;
    }
    .prompt {
      margin-right: 10px;
      font-weight: bold;
      color: #00FF00;
      font-size: 18px;
    }
    #url-input {
      background: #000000;
      border: 2px solid #FFFFFF;
      color: #FFFF00;
      font-family: 'Courier New', Courier, monospace;
      font-size: 18px;
      flex-grow: 1;
      outline: none;
      padding: 2px 5px;
      text-transform: uppercase;
    }
    #url-input:focus {
      background-color: #0000FF;
      color: #FFFFFF;
      border-color: #00FFFF;
    }
    #favourites-bar {
      display: flex;
      align-items: center;
      overflow-x: auto;
      gap: 15px;
      padding-top: 2px;
    }
    .fav-item {
      color: #00FFFF;
      text-transform: uppercase;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      padding: 0 5px;
    }
    .fav-item:hover {
      background-color: #00FFFF;
      color: #000000;
    }
    
    /* Settings Modal */
    #settings-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #000000;
      border: 4px solid #FFFF00;
      padding: 20px;
      z-index: 1000;
      flex-direction: column;
      min-width: 300px;
    }
    #settings-modal.visible {
      display: flex;
    }
    #settings-modal h2 {
      margin-top: 0;
      color: #FFFF00;
      text-transform: uppercase;
      border-bottom: 2px solid #FFFF00;
      padding-bottom: 5px;
    }
    .theme-option {
      margin: 10px 0;
      cursor: pointer;
      padding: 10px;
      border: 2px solid #555;
      text-transform: uppercase;
      font-weight: bold;
    }
    .theme-option:hover {
      border-color: #00FFFF;
    }
    .theme-option.selected {
      border-color: #00FF00;
      color: #00FF00;
    }
  </style>
</head>
<body>
  <div id="settings-modal">
    <h2>Settings / Region</h2>
    <div class="theme-option selected" data-theme="ceefax">Ceefax (UK)</div>
    <div class="theme-option" data-theme="antiope">Antiope/Minitel (France)</div>
    <div class="theme-option" data-theme="videotext">ARD Videotext (Germany)</div>
    <button id="close-settings" style="margin-top: 15px;">Close</button>
  </div>

  <div id="browser-ui">
    <div id="tab-bar">
      <!-- Tabs injected here -->
      <button id="new-tab-btn">+</button>
    </div>
    <div id="top-bar">
      <button id="back-btn" title="Back">&lt;</button>
      <button id="forward-btn" title="Forward">&gt;</button>
      <button id="refresh-btn" title="Refresh">↻</button>
      <button id="home-btn" title="Home">⌂</button>
      <form id="url-form">
        <span class="prompt">&gt;</span>
        <input type="text" id="url-input" placeholder="enter url or search..." autocomplete="off">
      </form>
      <button id="fav-btn" title="Add Favourite">[+ FAV]</button>
      <button id="settings-btn" title="Settings">⚙ SETTINGS</button>
    </div>
    <div id="favourites-bar">
      <!-- Favourites will be injected here -->
    </div>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
